# Runs the test suite on Windows, macOS and Linux on every push and pull request.
# Uses a fake DeepL client, so it needs no API key and uses no quota.

name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false  # if one OS fails, still see the results for the others
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen  # no screen on CI machines: draw windows in memory

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt

      # Qt needs a few system graphics libraries that Ubuntu runners don't ship with.
      - name: Install Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3

      - name: Install libraries
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -v
